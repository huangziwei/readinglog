[workspace]
resolver = "3"
members = ["native", "desktop"]
# `default-members` holds a bare `cargo build`, `test` or `clippy` to `native`.
default-members = ["native"]

# `version` is the one both members state, `version.workspace = true`.
[workspace.package]
version = "0.4.0"
license = "GPL-3.0-or-later"

[profile.dev]
incremental = true

# `"*"` sets every dependency, never a member, at `opt-level = 3`.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
