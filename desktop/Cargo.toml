# Outside the root workspace, which `release.yml` lints with no webview.
[workspace]

[package]
name = "readinglog-desktop"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lib]
name = "readinglog_desktop"
path = "src/lib.rs"

[[bin]]
name = "readinglog-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window. `protocol-asset` serves the record's covers from disk.
tauri = { version = "2", features = ["protocol-asset"] }
# Picking a backup and the record's folder.
tauri-plugin-dialog = "2"
# Showing the record's folder in the Finder.
tauri-plugin-opener = "2"
# The record, the stats and the backups, read the way the Kindle reads them.
readinglog-native = { path = "../native" }
# Error propagation with context strings through an import and a build.
anyhow = "1"
# site.toml, books.toml, highlights.toml, sittings.toml, a post's front matter.
serde = { version = "1", features = ["derive"] }
toml = "1"
# A post's Markdown, to HTML. `html` alone: no command line, no SIMD scanner.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# A book's tone off its cover; the decoders `readinglog-native` builds already.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Reading a Kindle that offers MTP and no mass storage (2024 and after), as
# sidle reads one. Pinned exact as sidle pins it: a young crate whose API moves,
# bumped only with a round trip on a real Kindle.
mtp-rs = "=0.15.0"
# Drives `mtp-rs`'s async calls from the `Transport` trait's plain ones.
futures = "0.3"
# A mounted Kindle's serial, off its USB `iSerial` descriptor. The version
# `mtp-rs` resolves, so one copy is built.
nusb = "=0.2.3"

[dev-dependencies]
# What the window sends a command, read the way Tauri reads it.
serde_json = "1"

[features]
# `cargo tauri build` turns this on: the window loads `web/` from the binary.
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

# `readinglog-native` draws and decodes covers; built once at 3, as the root
# workspace builds it for `preview`.
[profile.dev.package."*"]
opt-level = 3
